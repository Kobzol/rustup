# GitHub Actions workflow generated by ci/actions-templates/gen-workflows.sh
# Do not edit this file in .github/workflows

name: CI

on:
  push:
  pull_request:

jobs:
  test-perf:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Install hyperfine
        run: cargo install hyperfine
      - name: Build Rustup PR
        run: cargo build --release
      - name: Benchmark PR
        run: |
          export RUSTUP_HOME=/tmp/pr
          export RUSTUP_CONCURRENT_DOWNLOADS=1
          mkdir -p /tmp/pr
          hyperfine --prepare "RUSTUP_FORCE_ARG0=rustup ./target/release/rustup-init uninstall nightly" \
            "RUSTUP_FORCE_ARG0=rustup ./target/release/rustup-init install nightly"
      - name: Build rustup master
        run: |
          git clone https://github.com/rust-lang/rustup rustup-master
          cd rustup-master
          cargo build --release
          export RUSTUP_HOME=/tmp/master
          export RUSTUP_CONCURRENT_DOWNLOADS=1
          mkdir -p /tmp/master
          hyperfine --prepare "RUSTUP_FORCE_ARG0=rustup ./target/release/rustup-init uninstall nightly" \
                      "RUSTUP_FORCE_ARG0=rustup ./target/release/rustup-init install nightly"
